name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:

jobs:
  music-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Simonlee789
          filename: metrics-music.svg
          template: classic
          base: ""
          config_timezone: Asia/Bangkok

          plugin_music: yes
          plugin_music_mode: playlist
          plugin_music_limit: 6
          plugin_music_provider: apple
          plugin_music_playlist: https://music.apple.com/th/playlist/k-pop-%E0%B8%AA-%E0%B8%94%E0%B8%AE-%E0%B8%95-2025/pl.161503b34ff7441a949c81bd19525b35?l=th
