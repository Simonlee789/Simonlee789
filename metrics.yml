name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:

jobs:
  music-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Simonlee789
          filename: metrics-music.svg
          template: classic
          base: ""
          config_timezone: Asia/Bangkok

          plugin_music: yes
          plugin_music_mode: playlist
          plugin_music_limit: 6
          plugin_music_provider: apple
          plugin_music_playlist: hhttps://open.spotify.com/playlist/0TtVS5GoshOkaZB4ilhDhr?si=91ef2672a22245b3
